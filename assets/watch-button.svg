<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 84" width="420" height="84" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="420" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="420" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Card with glow -->
  <rect x="2" y="2" width="416" height="80" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />
  
  <!-- Ambient glow in left corner -->
  <circle cx="48" cy="42" r="28" fill="#ef4444" opacity="0.25" filter="url(#glow)" />
  
  <!-- Red Play Badge -->
  <rect x="24" y="20" width="44" height="44" rx="12" fill="#E50914" />
  <path d="M42 42L35 37.5V46.5L42 42Z" fill="white" />

  <!-- Text -->
  <text x="82" y="38" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" letter-spacing="-0.01em">
    Смотреть вместе онлайн
  </text>
  <text x="82" y="56" fill="#888888" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
    Синхронный YouTube &amp; VK Видео • WebRTC
  </text>

  <!-- Arrow Indicator -->
  <circle cx="378" cy="42" r="16" fill="#222222" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <path d="M375 36L381 42L375 48" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
